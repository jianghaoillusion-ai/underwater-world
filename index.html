<style>

<div id="fb"><h2>需要 WebGPU</h2><p>這個海底世界以 WebGPU 即時繪製。<br>請使用 iOS 26 以上的 Safari，或新版 Chrome／Edge。</p><p class="en">This underwater world needs WebGPU.<br>Please use Safari on iOS 26+, or a recent Chrome / Edge.</p></div>
<script>
'use strict';
// ---------------------------------------------------------------- WGSL: noise + terrain (shared by GPU heightmap generation)
const W_NOISE=`
const PI=3.14159265;const TAU=6.28318531;
fn hu(x:u32)->u32{var v=x*747796405u+2891336453u;v=((v>>((v>>28u)+4u))^v)*277803737u;return (v>>22u)^v;}
fn hf(x:u32)->f32{return f32(hu(x))*2.3283064e-10;}
fn h2(p:vec2i)->f32{return hf((bitcast<u32>(p.x)*1597334677u)^hu(bitcast<u32>(p.y)));}
fn h3(p:vec3i)->f32{return hf((bitcast<u32>(p.x)*1597334677u)^hu((bitcast<u32>(p.y)*3812015801u)^hu(bitcast<u32>(p.z))));}
fn vn2(p:vec2f)->f32{let i=vec2i(floor(p));let f=fract(p);let w=f*f*f*(f*(f*6.-15.)+10.);
 return mix(mix(h2(i),h2(i+vec2i(1,0)),w.x),mix(h2(i+vec2i(0,1)),h2(i+vec2i(1,1)),w.x),w.y);}
fn vn3(p:vec3f)->f32{let i=vec3i(floor(p));let f=fract(p);let w=f*f*(3.-2.*f);
 let a=mix(mix(h3(i),h3(i+vec3i(1,0,0)),w.x),mix(h3(i+vec3i(0,1,0)),h3(i+vec3i(1,1,0)),w.x),w.y);
 let b=mix(mix(h3(i+vec3i(0,0,1)),h3(i+vec3i(1,0,1)),w.x),mix(h3(i+vec3i(0,1,1)),h3(i+vec3i(1,1,1)),w.x),w.y);
 return mix(a,b,w.z);}
fn fbm2(q:vec2f,o:i32)->f32{var p=q;var a=.5;var s=0.;for(var i=0;i<o;i++){s+=a*vn2(p);p=mat2x2f(1.6,1.2,-1.2,1.6)*p+vec2f(17.3,-9.1);a*=.5;}return s;}
fn fbm3(q:vec3f,o:i32)->f32{var p=q;var a=.5;var s=0.;for(var i=0;i<o;i++){s+=a*vn3(p);p=p*2.03+vec3f(7.1,-3.3,11.7);a*=.5;}return s;}
const SHIP=vec2f(6.,-22.);
fn terrainH(p:vec2f)->f32{
 let w=vec2f(fbm2(p*.008+3.1,3),fbm2(p*.008-7.7,3))*60.;
 let q=p+w;
 var h=-35.+fbm2(q*.01,4)*17.;
 let rn=vn2(q*.021)*2.-1.;let r=1.-sqrt(rn*rn+.012);
 h+=r*r*r*r*16.*smoothstep(.32,.62,vn2(q*.006+5.))*smoothstep(12.,40.,length(p-vec2f(0.,22.)));
 h+=(fbm2(p*.09,3)-.45)*1.8;
 h+=sin(p.x*.9+sin(p.y*.3)*2.)*.1;
 let ds=length((p-SHIP)*vec2f(.6,1.));
 h=mix(-31.+fbm2(p*.12,2)*1.2,h,smoothstep(13.,32.,ds));
 let e=max(abs(p.x),abs(p.y))/200.;
 h+=smoothstep(.72,.98,e)*48.;
 return min(h,-1.5);
}`;
// ---------------------------------------------------------------- WGSL: shared render/compute prelude
const W_PRE=W_NOISE+`
struct U{vp:mat4x4f,cam:vec4f,fwd:vec4f,rgt:vec4f,up:vec4f,res:vec4f,q:vec4f,q2:vec4f,q3:vec4f,pl:array<vec4f,6>}
@group(0)@binding(0) var<uniform> u:U;
@group(0)@binding(1) var<storage,read> hm:array<vec4f>;
const L=vec3f(.2794,.9315,.2329);
const HN=513u;
fn hs(x:i32,z:i32)->vec4f{return hm[u32(clamp(z,0,512))*HN+u32(clamp(x,0,512))];}
fn hmS(p:vec2f)->vec4f{let g=clamp((p/400.+.5)*512.,vec2f(0.),vec2f(511.999));let i=vec2i(floor(g));let f=g-floor(g);
 return mix(mix(hs(i.x,i.y),hs(i.x+1,i.y),f.x),mix(hs(i.x,i.y+1),hs(i.x+1,i.y+1),f.x),f.y);}
fn H(p:vec2f)->f32{return hmS(p).x;}
fn water(d:vec3f)->vec3f{
 var c=mix(vec3f(.003,.026,.06),vec3f(.012,.12,.2),smoothstep(-.7,.25,d.y));
 c=mix(c,vec3f(.08,.4,.46),smoothstep(.12,1.,d.y)*.85);
 c+=vec3f(.22,.46,.42)*pow(max(dot(d,L),0.),8.)*.45;
 return c*(.45+.55*exp(u.cam.y*.03));
}
const ABS=vec3f(.045,.024,.019);
fn fog(c:vec3f,p:vec3f)->vec3f{let v=p-u.cam.xyz;let d=max(length(v),1e-3);let T=exp(-d*ABS);return c*T+water(v/d)*(1.-T);}
fn caus(p:vec2f)->f32{
 let t=u.cam.w*.45+23.;
 let uv=fract(p/7.)*TAU-250.;var i=uv;var c=1.;
 for(var n=0;n<4;n++){let tt=t*(1.-3.5/f32(n+1));i=uv+vec2f(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
  c+=1./length(vec2f(uv.x/(sin(i.x+tt)/.005),uv.y/(cos(i.y+tt)/.005)));}
 c/=4.;c=1.17-pow(c,1.4);return pow(abs(c),8.);
}
fn lit(a:vec3f,n:vec3f,p:vec3f,ao:f32)->vec3f{
 let dk=exp(p.y*.04);
 let q=p.xz-L.xz*(p.y/L.y);
 let cs=caus(q)*smoothstep(0.,.7,n.y);
 let nl=max(dot(n,L),0.);
 let sun=vec3f(1.,.96,.84)*nl*(.45+2.4*cs)*dk*1.5;
 let amb=mix(vec3f(.012,.05,.07),vec3f(.09,.27,.31),n.y*.5+.5)*(.4+.6*dk);
 return a*(sun+amb)*ao;
}
fn ray(fc:vec2f)->vec3f{let nd=vec2f(fc.x*u.res.z*2.-1.,1.-fc.y*u.res.w*2.);
 return normalize(u.fwd.xyz+u.rgt.xyz*(nd.x*u.fwd.w*u.rgt.w)+u.up.xyz*(nd.y*u.fwd.w));}
fn ign(p:vec2f)->f32{return fract(52.9829189*fract(dot(p,vec2f(.06711056,.00583715))));}
fn inFr(c:vec3f,r:f32)->bool{for(var i=0;i<6;i++){if(dot(u.pl[i].xyz,c)+u.pl[i].w< -r){return false;}}return true;}
fn sn(v:vec3f)->vec3f{return v*inverseSqrt(max(dot(v,v),1e-12));}
`;
// ---------------------------------------------------------------- heightmap generation (compute, once)
const W_GEN=W_NOISE+`
@group(0)@binding(1) var<storage,read_write> hm:array<vec4f>;
@compute @workgroup_size(8,8) fn gen(@builtin(global_invocation_id) g:vec3u){
 if(g.x>=513u||g.y>=513u){return;}
 let p=(vec2f(g.xy)/512.-.5)*400.;let e=.4;
 let h=terrainH(p);
 let hx=terrainH(p+vec2f(e,0.))-terrainH(p-vec2f(e,0.));
 let hz=terrainH(p+vec2f(0.,e))-terrainH(p-vec2f(0.,e));
 hm[g.y*513u+g.x]=vec4f(h,normalize(vec3f(-hx,2.*e,-hz)));
}`;
// ---------------------------------------------------------------- terrain
const W_TER=W_PRE+`
struct TO{@builtin(position) pos:vec4f,@location(0) wp:vec3f,@location(1) n:vec3f}
@vertex fn vs(@builtin(vertex_index) vi:u32)->TO{
 let st=u32(u.q3.y);let seg=512u/st;let qd=vi/6u;let k=vi%6u;
 let ox=select(0u,1u,k==1u||k==4u||k==5u);let oz=select(0u,1u,k==2u||k==3u||k==5u);
 let gx=(qd%seg+ox)*st;let gz=(qd/seg+oz)*st;
 let d=hm[gz*HN+gx];
 let p=vec3f((f32(gx)/512.-.5)*400.,d.x,(f32(gz)/512.-.5)*400.);
 var o:TO;o.pos=u.vp*vec4f(p,1.);o.wp=p;o.n=d.yzw;return o;
}
@fragment fn fs(i:TO)->@location(0) vec4f{
 let p=i.wp;var n=normalize(i.n);
 let rock=smoothstep(.84,.66,n.y)+smoothstep(-20.,-13.,p.y)*.6;
 let rk=clamp(rock,0.,1.);
 let e=.07;let b0=fbm2(p.xz*1.4,2);
 let bx=fbm2(p.xz*1.4+vec2f(e,0.),2)-b0;let bz=fbm2(p.xz*1.4+vec2f(0.,e),2)-b0;
 n=normalize(n+vec3f(-bx,0.,-bz)*(2.5+rk*7.));
 let rd=normalize(vec2f(.9,.43));let rr=dot(p.xz,rd)*2.3+vn2(p.xz*.25)*5.;
 n=normalize(n-vec3f(rd.x,0.,rd.y)*cos(rr)*.22*(1.-rk));
 var sand=vec3f(.6,.5,.34)*(.82+.4*b0);
 sand=mix(sand,vec3f(.33,.3,.26),smoothstep(.7,.85,vn2(p.xz*7.3))*.35);
 sand=mix(sand,vec3f(.22,.27,.12),smoothstep(.55,.85,vn2(p.xz*.13))*.45);
 var rc=mix(vec3f(.2,.19,.18),vec3f(.4,.34,.27),vn2(vec2f(p.y*1.9,(p.x+p.z)*.08)));
 rc=mix(rc,vec3f(.09,.17,.05),smoothstep(.45,.9,n.y)*vn2(p.xz*.6)*.9);
 rc=mix(rc,vec3f(.45,.17,.27),smoothstep(.78,.84,vn2(p.xz*4.1+p.y))*.3);
 let a=mix(sand,rc,rk);
 let c=lit(a,n,p,1.);
 return vec4f(fog(c,p),distance(p,u.cam.xyz));
}`;
// ---------------------------------------------------------------- parametric shapes: rocks, arches, sponges, ship, mantas, fans, corals
const W_SHP=W_PRE+`
struct SI{a:vec4f,b:vec4f,c:vec4f,d:vec4f,e:vec4f}
@group(1)@binding(0) var<storage,read> si:array<SI>;
struct SO{@builtin(position) pos:vec4f,@location(0) wp:vec3f,@location(1) n:vec3f,@location(2) uv:vec2f,@location(3) @interpolate(flat) col:vec4f,@location(4) @interpolate(flat) ts:vec2f}
fn rot(y:f32,p:f32,r:f32)->mat3x3f{
 let cy=cos(y);let sy=sin(y);let cp=cos(p);let sp=sin(p);let cr=cos(r);let sr=sin(r);
 return mat3x3f(cy,0.,-sy,0.,1.,0.,sy,0.,cy)*mat3x3f(1.,0.,0.,0.,cp,sp,0.,-sp,cp)*mat3x3f(cr,sr,0.,-sr,cr,0.,0.,0.,1.);
}
fn surf(t:u32,uv:vec2f,s:f32,pr:f32)->vec3f{
 var p=vec3f(0.);let T=u.cam.w;
 switch t{
  case 0u:{let th=uv.x*PI;let ph=uv.y*TAU;let d=vec3f(sin(th)*cos(ph),cos(th),sin(th)*sin(ph));
   p=d*(1.+(fbm3(d*1.3+s*17.,3)-.45)*.75);}
  case 1u:{let a=mix(-.16,PI+.16,uv.x);let b=uv.y*TAU;
   let r=pr*(1.+(fbm3(vec3f(a*1.6,cos(b)*.9,sin(b)*.9)+s*9.,2)-.45)*select(.35,1.5,pr>.12));
   p=vec3f(cos(a)*(1.+r*cos(b)),sin(a)*(1.+r*cos(b)),r*sin(b));}
  case 2u:{let s2=uv.x*1.3;let an=uv.y*TAU;var y=s2;var r=.36+.24*s2;
   if(s2>1.){y=1.-(s2-1.)*2.6;r=.5;}
   r*=1.+.07*sin(an*6.+s*20.+y*3.);p=vec3f(cos(an)*r,y,sin(an)*r);}
  case 3u:{let x=uv.x-.5;let bm=sqrt(max(1.-pow(abs(2.*x),select(3.,1.8,x>0.)),0.));
   let a=mix(-1.25,1.25,uv.y);let kl=.25+.75*bm;let sh=1.4*x*x;
   if(abs(a)<=1.){let g=a*PI*.5;p=vec3f(x,-cos(g)*kl+sh,sin(g)*bm);}
   else{p=vec3f(x,(abs(a)-1.)*1.6+sh,sign(a)*bm);}}
  case 4u:{let an=uv.y*TAU;p=vec3f(cos(an),uv.x,sin(an));}
  case 5u:{let sp=uv.y*2.-1.;let aw=abs(sp);
   let fr=mix(.42,-.06,pow(aw,1.2))+.06*smoothstep(.2,.1,aw);
   let bk=mix(-.5,-.09,pow(aw,.55));
   var y=.11*pow(max(1.-aw*1.7,0.),2.)*sin(uv.x*PI);
   y+=sin(T*1.6+s*6.-aw*2.3)*pow(aw,1.5)*.4;
   p=vec3f(mix(bk,fr,uv.x),y,sp);}
  case 6u:{let an=uv.y*TAU;let r=.025*(1.-uv.x)+.002;
   let y=sin(T*1.6+s*6.-2.-uv.x*3.)*.06*uv.x;p=vec3f(-.45-uv.x*1.15,y+r*sin(an),r*cos(an));}
  case 7u:{let r=uv.x;let a=mix(-1.05,1.05,uv.y);
   p=vec3f(sin(a)*r*.95,cos(a)*r,r*r*.16*sin(a*3.+s)+sin(T*.9+s*7.)*.07*r*r);}
  default:{let th=uv.x*PI*.5;let ph=uv.y*TAU;let d=vec3f(sin(th)*cos(ph),cos(th),sin(th)*sin(ph));
   p=d*(1.+.035*sin(vn3(d*3.+s)*26.));}
 }
 return p;
}
@vertex fn vs(@builtin(vertex_index) vi:u32,@builtin(instance_index) ii:u32)->SO{
 let I=si[ii];let t=u32(I.c.x);let sd=I.c.y;let su=u32(I.c.z);let sv=u32(I.c.w);
 var o:SO;var org=I.a.xyz;var M=rot(I.b.w,I.e.x,I.e.y);
 if(t==5u||t==6u){
  let T=u.cam.w;let R=I.d.w;let w=I.e.z;let an=I.e.w+T*w;let sg=sign(w);
  org=I.a.xyz+vec3f(cos(an)*R,sin(T*.25+sd*5.)*1.6,sin(an)*R);
  let fw=normalize(vec3f(-sin(an)*sg,.06*cos(T*.25+sd*5.),cos(an)*sg));
  let bank=-.32*sg;let r0=normalize(cross(fw,vec3f(0.,1.,0.)));let u0=cross(r0,fw);
  let rt=r0*cos(bank)+u0*sin(bank);let up=cross(rt,fw);
  M=mat3x3f(fw,up,rt);
 }
 let sc=I.b.xyz;let rad=max(max(sc.x,sc.y),sc.z)*1.7;
 if(distance(org,u.cam.xyz)-rad>u.q2.x||!inFr(org,rad)){o.pos=vec4f(0.,0.,-2.,1.);return o;}
 let q=vi/6u;let k=vi%6u;
 let ox=select(0u,1u,k==1u||k==4u||k==5u);let oz=select(0u,1u,k==2u||k==3u||k==5u);
 let uv=vec2f(f32(q%su+ox)/f32(su),f32(q/su+oz)/f32(sv));
 let pr=I.d.w;
 let p0=surf(t,uv,sd,pr);
 let un=vec2f(clamp(uv.x,.015,.985),uv.y);let ex=.003;
 let pn=surf(t,un,sd,pr);
 let tu=M*((surf(t,un+vec2f(ex,0.),sd,pr)-pn)*sc);
 let tv=M*((surf(t,un+vec2f(0.,ex),sd,pr)-pn)*sc);
 var n=sn(cross(tu,tv));
 if(t==5u&&dot(n,M[1])<0.){n=-n;}
 let wp=org+M*(p0*sc);
 o.pos=u.vp*vec4f(wp,1.);o.wp=wp;o.n=n;o.uv=uv;o.col=I.d;o.ts=vec2f(f32(t),sd);
 return o;
}
@fragment fn fs(i:SO)->@location(0) vec4f{
 let t=u32(i.ts.x);let sd=i.ts.y;let V=normalize(u.cam.xyz-i.wp);let p=i.wp;
 var n=normalize(i.n);let top=dot(n,V)>0.;if(!top){n=-n;}
 var a=i.col.rgb;var ao=1.;var spec=0.;
 if(t==0u||(t==1u&&i.col.w>.12)){
  a*=.72+.55*vn2(vec2f(p.y*2.3,(p.x+p.z)*.15));
  a=mix(a,vec3f(.09,.18,.05),smoothstep(.5,.95,n.y)*vn2(p.xz*.7)*.85);
  a=mix(a,vec3f(.5,.18,.3),smoothstep(.76,.82,vn2(p.xz*3.1+p.y*1.3))*.35);
  ao=.55+.45*smoothstep(-1.,1.,n.y+.3);
 }
 if(t==3u){
  if(vn2(i.uv*vec2f(18.,7.)+sd)>.66&&i.uv.x<.42&&abs(i.uv.y-.5)>.1){discard;}
  let pl=fract(i.uv.y*30.);let fr=fract(i.uv.x*16.);
  a*=(.7+.3*smoothstep(0.,.1,pl)*smoothstep(1.,.9,pl))*(1.-.15*smoothstep(.93,.98,fr))*(.8+.35*vn2(vec2f(i.uv.x*300.,i.uv.y*30.)));
  a=mix(a,vec3f(.1,.19,.07),vn2(p.xz*.6+p.y)*.65);
  if(!top){ao=.5;}
 }
 if(t==2u){a*=.8+.35*vn2(i.uv*vec2f(40.,34.));if(i.uv.x>.77){ao=.3;}}
 if(t==7u){
  let w=vn2(vec2f(i.uv.y*14.,i.uv.x*6.)+sd);
  let br=abs(fract(i.uv.y*9.+w*1.5)-.5);let rg=abs(fract(i.uv.x*10.+w)-.5);
  if(min(br,rg)>.15&&i.uv.x>.08){discard;}

 const iy=(K.Space||K.KeyE||upB?1:0)-(K.KeyC||K.KeyQ||dnB?1:0),sp=(K.ShiftLeft||K.ShiftRight)?15:5.5;
 const k=Math.min(dt*2.2,1);
 vel[0]+=((fx*iz+rx*ix)*sp-vel[0])*k;vel[1]+=((fy*iz+iy)*sp-vel[1])*k;vel[2]+=((fz*iz+rz*ix)*sp-vel[2])*k;
 pos[0]+=vel[0]*dt;pos[1]+=vel[1]*dt;pos[2]+=vel[2]*dt;
 pos[0]=Math.max(-150,Math.min(150,pos[0]));pos[2]=Math.max(-150,Math.min(150,pos[2]));
 const g=Hj(pos[0],pos[2])+1.4;if(pos[1]<g){pos[1]=g;if(vel[1]<0)vel[1]=0;}
 if(pos[1]>-1.2){pos[1]=-1.2;if(vel[1]>0)vel[1]=0;}
}

function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(!(dt>0))dt=.016;dt=Math.min(dt,.05);T+=dt;frameNo++;st.frames=frameNo;
 perf(dt);update(dt);resize();writeU(dt);
 dev.queue.writeBuffer(ub,0,U);
 const enc=dev.createCommandEncoder();
 enc.clearBuffer(indB,4,4);enc.clearBuffer(indB,20,4);
 const cp=enc.beginComputePass();cp.setBindGroup(0,bg0);
 cp.setPipeline(pCull);cp.setBindGroup(1,bgCull);cp.dispatchWorkgroups(Math.ceil(Q.G*Q.G/64));
 cp.setPipeline(pFishC);cp.setBindGroup(1,ping?bgFB:bgFA);cp.dispatchWorkgroups(Math.ceil(Q.fish/64));cp.end();
 const rp=enc.beginRenderPass(sceneDesc);rp.setBindGroup(0,bg0);
 rp.setPipeline(pTer);rp.draw((512/Q.st)*(512/Q.st)*6);
 rp.setPipeline(pShape);rp.setBindGroup(1,bgShape);
 for(let i=0;i<groups.length;i++){const g=groups[i];if(g.n)rp.draw(g.vc,g.n,0,g.first);}
 rp.setPipeline(pStem);rp.setBindGroup(1,bgKelp);rp.drawIndirect(indB,0);
 rp.setPipeline(pLeaf);rp.drawIndirect(indB,16);
 rp.setPipeline(pFish);rp.setBindGroup(1,ping?bgFRA:bgFRB);rp.draw(288,Q.fish);
 rp.setPipeline(pBg);rp.draw(3);
 rp.setPipeline(pPart);rp.draw(6,Q.bub+Q.snow);
 rp.end();
 postDesc.colorAttachments[0].view=ctx.getCurrentTexture().createView();
 const pp=enc.beginRenderPass(postDesc);pp.setPipeline(pPost);pp.setBindGroup(0,bg0);pp.setBindGroup(1,bgPost);pp.draw(3);pp.end();
 cbs[0]=enc.finish();dev.queue.submit(cbs);ping^=1;
}

// --- audio (synthesized, starts only after the Dive gesture)
let ac=null,mg=null,muted=false;
function startAudio(){
 if(ac){ac.resume();return;}
 try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 const t0=ac.currentTime;mg=ac.createGain();mg.gain.value=0;mg.connect(ac.destination);mg.gain.setTargetAtTime(muted?0:.5,t0,1.5);
 const len=ac.sampleRate*6|0,nb=ac.createBuffer(2,len,ac.sampleRate);
 for(let c=0;c<2;c++){const d=nb.getChannelData(c);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l;}
  const e=d[len-1];let mx=0;for(let i=0;i<len;i++){d[i]-=e*i/len;mx=Math.max(mx,Math.abs(d[i]));}for(let i=0;i<len;i++)d[i]/=mx;}
 const src=ac.createBufferSource();src.buffer=nb;src.loop=true;
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;lp.Q.value=.6;
 const lfo=ac.createOscillator();lfo.frequency.value=.07;const lg=ac.createGain();lg.gain.value=160;lfo.connect(lg);lg.connect(lp.frequency);
 const g1=ac.createGain();g1.gain.value=.55;src.connect(lp);lp.connect(g1);g1.connect(mg);
 const pf=ac.createBiquadFilter();pf.type='lowpass';pf.frequency.value=520;const pg=ac.createGain();pg.gain.value=.03;
 [55,82.41,110.3,164.8].forEach((f,i)=>{const o=ac.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=f;o.detune.value=(i-1.5)*7;o.connect(pf);o.start();});
 const tl=ac.createOscillator();tl.frequency.value=.05;const tg=ac.createGain();tg.gain.value=.018;tl.connect(tg);tg.connect(pg.gain);
 pf.connect(pg);pg.connect(mg);src.start();lfo.start();tl.start();bubbles();
}
function bubbles(){
 setTimeout(bubbles,700+Math.random()*2800);if(!ac||muted||ac.state!=='running')return;
 const n=1+(Math.random()*4|0);
 for(let i=0;i<n;i++){const t=ac.currentTime+i*.07+Math.random()*.05,o=ac.createOscillator(),g=ac.createGain(),f=320+Math.random()*700;
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.3,t+.07);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g);
  if(ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=Math.random()*1.6-.8;g.connect(p);p.connect(mg);}else g.connect(mg);
  o.start(t);o.stop(t+.1);}
}
$('snd').onclick=()=>{muted=!muted;$('snd').classList.toggle('off',muted);if(mg)mg.gain.setTargetAtTime(muted?0:.5,ac.currentTime,.3);};
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume();});
$('qt').onclick=()=>{if(auto){auto=false;setQ(0);}else if(qi<2)setQ(qi+1);else{auto=true;setQ(autoQ);}};

// --- dive / controls
const hint=$('hint');
if(TOUCH)hint.classList.add('t');
hint.textContent=TOUCH?'左側滑動 游動 · 右側拖曳 轉向 · 右下按鈕 上浮／下潛':'WASD 游動 · 滑鼠 轉向 · Space / E 上浮 · C / Q 下潛 · Shift 加速 · 點擊畫面鎖定滑鼠';
function startDive(silent){
 if(diving)return;diving=true;$('ov').classList.add('hide');$('ui').classList.remove('hide');
 if(silent)return;startAudio();
 if(TOUCH){$('ud').style.display='flex';}else if(cv.requestPointerLock){try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(e){}}
}
$('go').onclick=()=>startDive(false);
addEventListener('keydown',e=>{if(e.code in K){K[e.code]=true;e.preventDefault();}if(!diving&&(e.code==='Enter'||e.code==='Space'))startDive(false);});
addEventListener('keyup',e=>{if(e.code in K)K[e.code]=false;});
addEventListener('blur',()=>{for(const c in K)K[c]=false;});
const look=(dx,dy,s)=>{yaw+=dx*s;pitch=Math.max(-1.45,Math.min(1.45,pitch-dy*s));};
cv.addEventListener('mousedown',()=>{if(!diving||TOUCH)return;drag=true;if(document.pointerLockElement!==cv&&cv.requestPointerLock){try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(e){}}});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(!diving)return;if(document.pointerLockElement===cv)look(e.movementX,e.movementY,.0022);else if(drag)look(e.movementX,e.movementY,.004);});
// touch: dynamic left joystick, right-side look, up/down buttons
let joyId=null,jx0=0,jy0=0,lookId=null,lx=0,ly=0,hinted=false;const joy=$('joy'),knob=$('knob');
cv.addEventListener('touchstart',e=>{e.preventDefault();if(!diving)return;
 if(!hinted){hinted=true;hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),4000);}
 for(const t of e.changedTouches){
  if(t.clientX<innerWidth*.45&&joyId===null){joyId=t.identifier;jx0=t.clientX;jy0=t.clientY;joy.style.left=jx0+'px';joy.style.top=jy0+'px';joy.style.opacity=1;knob.style.transform='';}
  else if(lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY;}}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
 for(const t of e.changedTouches){
  if(t.identifier===joyId){let dx=(t.clientX-jx0)/52,dy=(t.clientY-jy0)/52;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
   joyX=dx;joyY=-dy;knob.style.transform='translate('+dx*36+'px,'+dy*36+'px)';}
  else if(t.identifier===lookId){look(t.clientX-lx,t.clientY-ly,.0055);lx=t.clientX;ly=t.clientY;}}},{passive:false});
const tend=e=>{for(const t of e.changedTouches){if(t.identifier===joyId){joyId=null;joyX=joyY=0;joy.style.opacity=0;}if(t.identifier===lookId)lookId=null;}};
cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
const btn=(id,f)=>{const b=$(id);const on=v=>e=>{e.preventDefault();e.stopPropagation();f(v);b.classList.toggle('on',v);};
 b.addEventListener('touchstart',on(true),{passive:false});b.addEventListener('touchend',on(false),{passive:false});b.addEventListener('touchcancel',on(false),{passive:false});};
btn('bu',v=>upB=v);btn('bd',v=>dnB=v);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.target===document.body||e.target===document.documentElement)e.preventDefault();},{passive:false});
addEventListener('contextmenu',e=>e.preventDefault());

init().catch(e=>{console.error(e);fail();});
</script>
